# Triggered by the `vX.Y.Z` tag pushed after a release commit bumping Chart.yaml's version.
# Packages the chart and pushes it as an OCI artifact to GHCR, which is what the ArgoCD
# ApplicationSet consumes.
#
# Pushed under the repository path, not the bare org: `helm push` names the artifact after
# Chart.yaml's `name`, so oci://ghcr.io/svaroglab would land the chart at
# ghcr.io/svaroglab/dnscontrol - colliding with the controller's own container image. Under the
# repo path it becomes ghcr.io/svaroglab/dnscontrol-helm/dnscontrol, which is distinct.
name: Release chart

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint .

      # Chart.yaml is the source of truth for the chart's own version; this fails loudly if the
      # pushed tag disagrees with it.
      - name: verify Chart.yaml version matches the tag
        run: |
          chart_version="v$(helm show chart . | grep -E '^version:' | awk '{print $2}')"
          if [ "$chart_version" != "${{ github.ref_name }}" ]; then
            echo "::error::Chart.yaml version ($chart_version) does not match tag (${{ github.ref_name }})"
            exit 1
          fi

      # github.repository keeps the org's original casing; an OCI reference must be lowercase.
      - name: Resolve the registry
        run: echo "OCI=oci://ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package
        run: helm package . -d dist/

      - name: Push
        run: helm push dist/*.tgz "$OCI"
