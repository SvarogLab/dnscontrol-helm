apiVersion: v2
name: dnscontrol
description: >-
  Converges Google Cloud DNS managed zones and record sets to a directory of declarative YAML,
  running as a controller that watches a mounted ConfigMap.
type: application
# The chart's own version, bumped independently of the controller it deploys.
version: 0.1.2
# The dnscontrol release this chart defaults to.
appVersion: "v0.2.0"
home: https://github.com/SvarogLab/dnscontrol-helm
sources:
  - https://github.com/SvarogLab/dnscontrol-helm
  - https://github.com/SvarogLab/dnscontrol
